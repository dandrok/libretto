[package]
name = "libretto"
version = "1.2.0"
edition = "2024"
rust-version = "1.99"
description = "Read EPUB and PDF books aloud in your terminal with a local TTS"
keywords = ["tts", "epub", "audiobook", "kokoro", "cli"]
categories = ["command-line-utilities", "multimedia::audio", "text-processing"]
exclude = [".githooks", ".github", "AGENTS.md", "deny.toml", "release-plz.toml", "docs"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dandrok/libretto"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"
ureq = { version = "3.5", features = ["rustls", "json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
blake3 = "1"
thiserror = "2"
anyhow = "1"
roxmltree = "0.21.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
