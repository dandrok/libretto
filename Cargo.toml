[package]
name = "libretto"
version = "1.1.1"
edition = "2024"
rust-version = "1.99"
description = "Add EPUB books to a local library and have them read aloud by a local TTS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dandrok/libretto"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"
ureq = { version = "3.5", features = ["rustls", "json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
blake3 = "1"
thiserror = "2"
anyhow = "1"
roxmltree = "0.21.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
