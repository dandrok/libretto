name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # PDF import shells out to poppler, which the runners do not always carry. The
      # PDF tests skip when it is missing, which would quietly shrink coverage.
      - name: install poppler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: install poppler (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - run: cargo test --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo build --all-features

  # Built from crates.io, not the Docker action: that image curls a GitHub release
  # asset with no --fail and no retry, so a 5xx from the release CDN hands an HTML
  # error page to `tar`, which exits 2 and turns the job red for nothing. crates.io
  # has retries in cargo and no third CDN in the path; the cost is a few minutes of
  # compilation. Pinned to the version that ran before, so the checks are the same.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny --all-features check

  # rustsec/audit-check needs the Checks API, which a fork's token cannot use.
  # cargo-audit installs from a prebuilt binary and reports plainly instead.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
