[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# CDLA-Permissive-2.0 covers webpki-roots: Mozilla's CA bundle shipped as data,
# not code. It is a permissive data licence, and replacing it would mean either
# a system trust store or no TLS verification at all.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# An allow-list entry nobody uses yet is not an incident.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
